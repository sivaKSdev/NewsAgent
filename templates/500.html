{% extends "base.html" %} {% block title %}Server Error - News Agent{% endblock
%} {% block extra_style %}
<style>
  .error-container {
    text-align: center;
    padding: 4rem 2rem;
    background: white;
    border-radius: 8px;
    margin: 2rem auto;
    max-width: 600px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
  }

  .error-code {
    font-size: 5rem;
    font-weight: bold;
    color: #dc3545;
    margin: 0;
  }

  .error-message {
    font-size: 1.5rem;
    color: #2c3e50;
    margin: 1rem 0;
  }

  .error-description {
    color: #666;
    margin: 1.5rem 0;
    line-height: 1.6;
  }
</style>
{% endblock %} {% block content %}
<div class="error-container">
  <h1 class="error-code">500</h1>
  <h2 class="error-message">Server Error</h2>
  <p class="error-description">
    Something went wrong on our end. We're working on fixing it. Please try
    again later.
  </p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-primary"
    >Go Back to Dashboard</a
  >
</div>
{% endblock %}
